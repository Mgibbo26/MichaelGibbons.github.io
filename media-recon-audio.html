<style>

.prog{flex:1;min-width:140px;height:8px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--teal)}

<main id="mr"><h1>Media Invoice Reconciliation Engine</h1>
<p class="sub">Narrated walkthrough · 18 stages · about 10 minutes · fictional test data only</p>
<div class="stage"><img id="mrImg" src="assets/media-recon/slide-01.jpg" alt="Walkthrough slide 1"></div>
<div class="bar">
<button type="button" id="mrPrev" aria-label="Previous slide">◀</button>
<button type="button" class="primary" id="mrPlay">▶ Play with voice-over</button>
<button type="button" id="mrNext" aria-label="Next slide">▶</button>
<div class="prog" aria-hidden="true"><i id="mrProg"></i></div><span class="count" id="mrCount">1 / 18</span>
<label><input type="checkbox" id="mrAuto" checked> Auto-advance</label>
<label><input type="checkbox" id="mrCapT" checked> Captions</label></div>
<div class="cap" id="mrCap" aria-live="polite"></div>
<div class="dots" id="mrDots"></div>
<audio id="mrAud" preload="auto"></audio>
<p class="note">Turn your sound on. All clients, vendors, people and amounts are fictitious.</p></main>
<script>
(function(){var D=[{"t": "Introduction", "n": "Welcome to the end-to-end walkthrough of the media invoice reconciliation engine. This is a testing-phase run, built entirely on fake data. Our fictional client is Harbourview Motors, and our five fictional media vendors have sent fifty invoices each. Over the next few minutes, we'll follow those invoices from the moment they land in Outlook, all the way through to reconciled MISR lines, Media Account Queries, held amounts, and automated emails to the media team."}, {"t": "The test pack", "n": "Here's the test pack. Two hundred and fifty-two emails arrived in the shared mailbox: two hundred and fifty invoices, one duplicate re-send, and one remittance advice. Between them they hold eleven thousand six hundred invoice lines. The TV invoices are the heavy ones, five to six pages each, with more than eight and a half thousand spots in total. On the billing side, MISR holds over seventeen thousand rows, alongside separate non-financial and unbilled reports."}, {"t": "Workflow in 10 steps", "n": "This is the full workflow in ten steps. Receive the email. Read the PDF, then file it. Classify the document. Extract the header and line detail. Load the three billing sources. Apply the vendor and media mapping. Run the matching cascade. Allocate the invoice number to MISR and decide the outcome. Send the automated email to the media team. And finally, produce the outputs and track every query until it's closed."}, {"t": "1 \u00b7 Receive", "n": "Step one. Vendor invoices arrive in the shared Media Invoices mailbox in Outlook Classic. The Python saver runs over the date range, saves every PDF attachment, keeps a copy of the original email for the audit trail, digs PDFs out of forwarded emails, and skips anything it has already saved. In this run, all two hundred and fifty-two emails were processed with no duplicates by file content."}, {"t": "2 \u00b7 Read & file", "n": "Step two. The engine reads each PDF before it files it, so the folder is driven by what's printed on the invoice, not by the email. The path is year, then month of service, then the agency named on the invoice, then the vendor. So this TV invoice lands in twenty twenty-six, September, Apex Media Sydney, Southern Cross TV Network. A re-sent duplicate and the remittance advice are routed to an exceptions folder instead."}, {"t": "3\u20134 \u00b7 Classify & extract", "n": "Steps three and four. Each document is classified first: tax invoice, consolidated invoice, remittance, or unknown. Then the header is extracted: invoice number, dates, month of service, agency, PO and schedule. Every line comes out too, including all five pages of a TV invoice. A roll-up check confirms the lines add back to the invoice subtotal and the GST is ten percent. All two hundred and fifty-one invoices passed."}, {"t": "5 \u00b7 Load billing", "n": "Step five. Three billing sources are loaded into DuckDB as separate reports. MISR is the financial billing to the client. The non-financial report holds bonus and makegood spots at zero dollars. And the unbilled report holds spots that are booked but not yet billed. Keeping all three is what stops false queries: a charge that looks wrong against MISR is often just not billed yet, or is a bonus spot."}, {"t": "6 \u00b7 Map", "n": "Step six is mapping. Vendor names, agencies and placements rarely match MISR word for word, so the engine keeps a crosswalk that you approve once and then reuse. In this run, one radio invoice arrived under a new trading name, Coastline Radio Network. The engine didn't guess. It suggested Coastline Radio Group at eighty-eight percent and parked the invoice until the mapping is approved."}, {"t": "7 \u00b7 Matching cascade", "n": "Step seven is the matching cascade. Invoice lines are only compared within the same vendor and schedule. Exact dates are matched first, across all three sources, then plus or minus one day. Market, station, site or account must agree, as must spot time, and the placement must score at least eighty-five on the fuzzy match. Each MISR line can only be used once. MISR is searched first, then unbilled, then non-financial."}, {"t": "8 \u00b7 Allocate & decide", "n": "Step eight is allocate and decide. Every matched line writes the vendor invoice number against the MISR line. Within the twenty-five dollar tolerance, it's matched. Below MISR, the difference is held. Above MISR, a Media Account Query is raised. A match in the unbilled report is pending billing, not a query. A bonus spot at zero is fine, but a bonus that's been charged becomes a query, and anything found nowhere is a ghost spot."}, {"t": "8 \u00b7 MISR allocated", "n": "Here's what that looks like in the MISR allocated view. Each MISR line for schedule SCTV two-oh-two-six-oh-nine, oh-three-six, now carries the vendor invoice number, the invoiced amount and a status. Most lines are matched. One Coastal Rescue spot in Perth was invoiced above MISR, so a query is raised for one hundred and eighty-eight dollars seventy-nine. Two Sydney spots were never invoiced, so their value is held."}, {"t": "Worked example", "n": "Let's walk through that invoice in full. Southern Cross TV invoice SCTV two-six-four-nine-one-three has a subtotal of one hundred and forty-seven thousand, two hundred and forty-eight dollars seventy-nine, against a MISR schedule of one hundred and forty-eight thousand, nine hundred and eighty. The difference of seventeen thirty-one twenty-one breaks down exactly into nineteen hundred and twenty dollars held, less one eighty-eight seventy-nine of Media Account Query. Three bonus spots at zero dollars were confirmed against the non-financial report."}, {"t": "Run results", "n": "This is the overall result. Of two hundred and fifty-one invoices, one hundred and seventy-four are AP ready straight away, which is sixty-nine percent straight-through. Forty-one invoices carry a Media Account Query, twenty-nine have held amounts, ten are waiting on billing, and three are exceptions. The review queue on the right sorts the largest queries first, so the team works on the biggest dollars first."}, {"t": "9 \u00b7 Automated email", "n": "Step nine is the automated email. For every invoice with a held amount or a query, the engine prepares one email to the media staff member who manages that vendor's MISR loadings, using the routing table. The subject is tagged AQ, HELD, or AQ plus HELD, with the invoice, client, month and net amount. The body summarises the lines needing action and gives a reply-by date. The original PDF and an invoice-level reconciliation file are attached. In phase one these are Outlook drafts for you to check before sending."}, {"t": "10 \u00b7 Outputs & tracking", "n": "Step ten covers outputs and tracking. The master workbook has a summary dashboard, invoice status, line match, held and query registers, pending billing, exceptions, and the MISR allocated view. Every held amount and query goes into a tracker that moves from sent, to acknowledged, to MISR updated, to closed. The next run re-checks against the refreshed MISR and closes items automatically, with reminders for anything overdue."}, {"t": "Exceptions", "n": "These are the exceptions the engine caught without any manual checking. One unmapped vendor name, one duplicate invoice, and one remittance advice. It also caught ten ghost spots that appear in no billing source, and five bonus spots that were charged when they should have been free. Each one is labelled with the reason, so nothing disappears silently."}, {"t": "Test result", "n": "And this is the testing proof. Every fake invoice was built with a known scenario, so we can check the engine's answer against the expected one. All two hundred and fifty invoices landed on the expected outcome. Perfect and rounding cases went to AP ready. Under-billed and missing spots were held. Over-billed, ghost and charged bonus spots raised queries. And the unbilled cases were correctly treated as pending billing."}, {"t": "Next steps", "n": "Before this goes to management, here's what to test next. Run it on one real month for one vendor, and compare the result with a manual reconciliation. Confirm the twenty-five dollar tolerance and the routing table with the media team. Review a sample of the draft emails. And then decide when to move from drafts to automatic sending. That's the complete workflow, from the inbox to a closed query."}],N=D.length,i=0,playing=false,$=function(x){return document.getElementById(x)};
var img=$('mrImg'),aud=$('mrAud'),cap=$('mrCap'),dots=$('mrDots'),pb=$('mrPlay');
function pad(n){return(n<10?'0':'')+n}
D.forEach(function(d,k){var b=document.createElement('button');b.type='button';b.textContent=k+1;b.title=d.t;b.addEventListener('click',function(){go(k,playing)});dots.appendChild(b)});
function go(k,play){i=Math.max(0,Math.min(N-1,k));img.src='assets/media-recon/slide-'+pad(i+1)+'.jpg';img.alt='Slide '+(i+1)+': '+D[i].t;
aud.src='assets/media-recon/narration-'+pad(i+1)+'.mp3';$('mrCount').textContent=(i+1)+' / '+N;$('mrProg').style.width='0';
cap.innerHTML='<b>'+(i+1)+'. '+D[i].t+'</b>'+D[i].n;cap.style.display=$('mrCapT').checked?'':'none';
Array.prototype.forEach.call(dots.children,function(b,j){b.classList.toggle('on',j===i)});
if(play){aud.play().catch(function(){setPlay(false)})}}
function setPlay(p){playing=p;pb.textContent=p?'❚❚ Pause':'▶ Play with voice-over'}
pb.addEventListener('click',function(){if(playing){aud.pause();setPlay(false)}else{setPlay(true);aud.play().catch(function(){setPlay(false)})}});
$('mrPrev').addEventListener('click',function(){go(i-1,playing)});$('mrNext').addEventListener('click',function(){go(i+1,playing)});
$('mrCapT').addEventListener('change',function(){cap.style.display=this.checked?'':'none'});
aud.addEventListener('timeupdate',function(){if(aud.duration)$('mrProg').style.width=(aud.currentTime/aud.duration*100)+'%'});
aud.addEventListener('ended',function(){if($('mrAuto').checked&&i<N-1){setTimeout(function(){go(i+1,true)},700)}else{setPlay(false)}});
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(i+1,playing);if(e.key==='ArrowLeft')go(i-1,playing)});
go(0,false)})();
</script></body></html>
